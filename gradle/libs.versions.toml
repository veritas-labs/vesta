[versions]
agp = "9.1.1"
# 37, not 36: Compose 1.12.x's Android artifacts (and qrose 1.3.0, which depends
# on them) declare a minCompileSdk of 37 in their AAR metadata, so anything below
# fails :shared:checkAndroidMainAarMetadata. targetSdk deliberately stays at 36 —
# compiling against newer APIs is independent of opting in to new runtime behavior.
android-compileSdk = "37"
# 26, not 24: org.automerge:androidnative's manifest declares minSdk 26.
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-camera = "1.6.2"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-sqlite = "2.7.1"
ant-android = "0.0.8-rc.1"
automerge = "0.0.9"
composeMultiplatform = "1.12.1"
compottie = "2.3.3"
eygraber-sqldelightAndroidxDriver = "0.2.2"
junit = "4.13.2"
licenseReport = "3.1.4"
junit-platform = "6.1.3"
junit-vintage = "6.1.3"
mlkit-barcodeScanning = "17.3.0"
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
# Tracks composeMultiplatform's major/minor: material3 reaches into foundation
# internals, so a skew breaks at runtime rather than at compile time. Leaving this
# on 1.11.0-alpha07 under Compose 1.12.1 made every OutlinedTextField test fail
# with "Must run runDetachLifecycle() once after runAttachLifecycle() and before
# markAsDetached()" from androidx.compose.ui.Modifier$Node. Published separately
# from Compose itself and only as alphas past 1.9 — 1.12.0-alpha03 is the newest
# on the 1.12 line (there is no material3 1.12.1).
material3 = "1.12.0-alpha03"
qrose = "1.3.0"
sqldelight = "2.4.0"
webcam-capture = "0.3.12"
zxing = "3.5.4"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Renders QR codes as a Compose Painter (rememberQrCodePainter) — no
# dependencies beyond compose.ui, so it needs no platform-specific wiring.
# No longer pinned below 1.2.0: that pin existed only to keep Compose off 1.12.x,
# which needs compileSdk 37 — this project is now on 37 (see android-compileSdk).
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
# Embedded Autonomi network bindings (UniFFI, in-process, no daemon) — see
# https://github.com/WithAutonomi/ant-android. Published to the ant-maven repo
# declared in settings.gradle.kts, not Maven Central.
ant-android = { module = "com.autonomi:ant-android", version.ref = "ant-android" }
# Automerge CRDT (https://github.com/automerge/automerge), official JNI-backed
# Java bindings — https://github.com/automerge/automerge/tree/main/rust/automerge-jni.
# JVM/Android only: the main jar bundles native libs for desktop (win/mac/linux,
# x64+arm64) and `androidnative` adds the Android .so; no iOS bindings exist
# upstream, so this is wired into jvmMain/androidMain only, not commonMain.
automerge = { module = "org.automerge:automerge", version.ref = "automerge" }
automerge-androidnative = { module = "org.automerge:androidnative", version.ref = "automerge" }
# Local-first SQLite persistence (KMP): shared schema + generated typed API, one
# bundled SQLite build (androidx.sqlite) on every platform — so the cr-sqlite
# CRDT extension (see shared/src/*Main/.../db/DatabaseDriverFactory.*.kt) loads
# the same way everywhere, unlike each platform's own system SQLite.
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutinesExtensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-asyncExtensions = { module = "app.cash.sqldelight:async-extensions", version.ref = "sqldelight" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
eygraber-sqldelightAndroidxDriver = { module = "com.eygraber:sqldelight-androidx-driver", version.ref = "eygraber-sqldelightAndroidxDriver" }
# Executable Gherkin specs (BDD) for feature-level behavior — JVM-only, so
# these run against shared's jvmTest source set, not commonTest. See
# docs/adr/ADR-003-device-sync.md for the device-pairing spec these back.
junitPlatform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junitVintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage" }

# Barcode scanning for the Pantry item form's "Scan" button. Android: CameraX
# preview + ML Kit's bundled (no Play Services download) barcode model.
# Desktop: sarxos webcam-capture frames decoded with ZXing.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
mlkit-barcodeScanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcodeScanning" }
webcam-capture = { module = "com.github.sarxos:webcam-capture", version.ref = "webcam-capture" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
licenseReport = { id = "com.github.jk1.dependency-license-report", version.ref = "licenseReport" }